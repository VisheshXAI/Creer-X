<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerX — Live Video Call Interview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --brand: #4F46E5;
      --cyan: #06B6D4;
      --danger: #EF4444;
      --success: #10B981;
      --text: #F9FAFB;
      --text-muted: #9CA3AF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Video Call Header */
    .call-header {
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 15, 25, 0.9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      z-index: 50;
    }

    .call-meta {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rec-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      color: var(--danger);
      letter-spacing: 0.05em;
    }

    .rec-pulse {
      width: 8px;
      height: 8px;
      background: var(--danger);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    .round-stepper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 14px;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }

    .round-dot {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .round-dot.active {
      color: #38BDF8;
      font-weight: 700;
    }

    /* Main Video Stage Area */
    .call-stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 140px);
      position: relative;
    }

    /* Left Video Frame (Mentor Main Camera) */
    .video-feed-container {
      position: relative;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .mentor-main-stream {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: brightness(0.95);
    }

    /* Video Overlays */
    .mentor-hud-tag {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .mentor-talking-wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 16px;
    }

    .wave-bar {
      width: 3px;
      background: var(--cyan);
      border-radius: 2px;
      animation: waveBounce 0.8s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes waveBounce {
      0% { height: 4px; }
      100% { height: 16px; }
    }

    /* Candidate Picture-in-Picture Webcam */
    .user-pip-frame {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 190px;
      height: 130px;
      background: #1F2937;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      overflow: hidden;
      z-index: 20;
      box-shadow: 0 10px 24px rgba(0,0,0,0.6);
    }

    .user-pip-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .pip-user-tag {
      position: absolute;
      bottom: 6px;
      left: 8px;
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(0,0,0,0.65);
      padding: 2px 8px;
      border-radius: 4px;
      color: #fff;
    }

    /* Connecting Overlay Animation */
    .call-connecting-screen {
      position: absolute;
      inset: 0;
      background: #0B0F19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 40;
      transition: opacity 0.5s ease;
    }

    .call-connecting-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .connection-pulse-ring {
      width: 90px;
      height: 90px;
      border: 3px solid var(--brand);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: ringSpread 1.6s infinite ease-out;
      margin-bottom: 20px;
    }

    @keyframes ringSpread {
      0% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(79, 70, 229, 0); }
      100% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
    }

    /* Right Cockpit: Interactive Dialogue & Transcript */
    .cockpit-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mentor-speech-bubble {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--cyan);
      border-radius: 14px;
      padding: 16px 20px;
    }

    .speech-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .speech-text {
      font-size: 16px;
      line-height: 1.5;
      font-weight: 600;
      color: #fff;
    }

    /* Candidate Answer Box */
    .answer-console {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .answer-textarea {
      flex: 1;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      color: #F3F4F6;
      font-size: 14.5px;
      line-height: 1.6;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    .answer-textarea:focus {
      border-color: var(--brand);
    }

    /* Bottom Action Controls Dock */
    .call-controls-bar {
      height: 80px;
      background: rgba(11, 15, 25, 0.95);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 0 24px;
      z-index: 50;
    }

    .ctrl-circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-circle-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .ctrl-circle-btn.active {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .submit-answer-btn {
      background: var(--brand);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.35);
    }

    .submit-answer-btn:hover {
      background: #4338CA;
      transform: scale(1.02);
    }

    .end-call-btn {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    @media (max-width: 1024px) {
      .call-stage {
        grid-template-columns: 1fr;
        height: auto;
      }
      .video-feed-container {
        height: 50vh;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="call-header">
    <div class="call-meta">
      <div class="brand-title">
        <i data-lucide="video" style="color:var(--cyan); width:20px; height:20px;"></i>
        CareerX Interview Call
      </div>
      <div class="rec-badge">
        <span class="rec-pulse"></span> REC 00:<span id="callDuration">00</span>
      </div>
    </div>

    <!-- 5 Rounds Progress -->
    <div class="round-stepper">
      <span class="round-dot active" id="dot1">1. Background</span>
      <span style="color:rgba(255,255,255,0.2);">•</span>
      <span class="round-dot" id="dot2">2. Technical</span>
      <span style="color:rgba(255,255,255,0.2);">•</span>
      <span class="round-dot" id="dot3">3. Projects</span>
      <span style="color:rgba(255,255,255,0.2);">•</span>
      <span class="round-dot" id="dot4">4. Problem</span>
      <span style="color:rgba(255,255,255,0.2);">•</span>
      <span class="round-dot" id="dot5">5. Goals</span>
    </div>
  </header>

  <!-- Video Call Workspace -->
  <main class="call-stage">

    <!-- Left Mentor Video Stream -->
    <div class="video-feed-container">
      
      <!-- Video Connection Loading -->
      <div class="call-connecting-screen" id="connectingScreen">
        <div class="connection-pulse-ring">
          <i data-lucide="phone-call" style="width:36px; height:36px; color:var(--brand);"></i>
        </div>
        <h3 style="font-size:20px; font-weight:700; margin-bottom:6px;">Establishing Secure AI Link...</h3>
        <p style="color:var(--text-muted); font-size:14px;">Connecting video call with <span id="connectingMentor">Arjun</span></p>
      </div>

      <!-- Live Looping Video Feed -->
      <video 
        id="mentorVideo"
        class="mentor-main-stream"
        autoplay 
        loop 
        muted 
        playsinline
        src="https://assets.mixkit.co/videos/preview/mixkit-portrait-of-a-fashion-man-looking-at-the-camera-40283-large.mp4">
      </video>

      <!-- Mentor In-call HUD Tag -->
      <div class="mentor-hud-tag">
        <div class="mentor-talking-wave" id="speakingWave">
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </div>
        <div>
          <div style="font-size:14px; font-weight:700;" id="mentorNamePlate">Arjun</div>
          <div style="font-size:11.5px; color:var(--cyan);" id="mentorRolePlate">Senior AI Engineer Mentor</div>
        </div>
      </div>

      <!-- Candidate Picture-in-Picture Stream -->
      <div class="user-pip-frame">
        <video id="userCam" autoplay playsinline muted></video>
        <div class="pip-user-tag">You (Candidate)</div>
      </div>
    </div>

    <!-- Right Side Dialogue & Response Console -->
    <div class="cockpit-panel">
      <!-- Live Mentor Speech Prompt -->
      <div class="mentor-speech-bubble">
        <div class="speech-label" id="speechLabel">MENTOR IS SPEAKING...</div>
        <div class="speech-text" id="speechText">Connecting call with your AI mentor...</div>
      </div>

      <!-- Candidate Answer Box -->
      <div class="answer-console">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label style="font-size:13px; font-weight:700; color:var(--text-muted);">YOUR RESPONSE</label>
          <span id="wordCounter" style="font-size:12px; color:var(--text-muted);">0 words</span>
        </div>
        <textarea 
          id="candidateInput" 
          class="answer-textarea" 
          placeholder="You can speak using the microphone button below or type your answer directly here..." 
          oninput="countWords()"></textarea>
      </div>
    </div>

  </main>

  <!-- Bottom Call Controls Dock -->
  <footer class="call-controls-bar">
    <button class="ctrl-circle-btn" id="micToggleBtn" onclick="toggleCandidateMic()" title="Toggle Microphone">
      <i data-lucide="mic" id="micIcon"></i>
    </button>
    <button class="ctrl-circle-btn" id="camToggleBtn" onclick="toggleCandidateCam()" title="Toggle Camera">
      <i data-lucide="video" id="camIcon"></i>
    </button>

    <button class="submit-answer-btn" id="submitAnswerBtn" onclick="sendAnswer()">
      Submit Answer & Next
      <i data-lucide="arrow-right" style="width:18px; height:18px;"></i>
    </button>

    <button class="end-call-btn" onclick="terminateCall()">
      <i data-lucide="phone-off" style="width:18px; height:18px;"></i>
      End Call
    </button>
  </footer>

  <script>
    lucide.createIcons();

    // 1. Identify Candidate & Selected Mentor
    const urlParams = new URLSearchParams(window.location.search);
    const selectedMentor = urlParams.get('mentor') || "{{ mentor }}" || "Arjun";
    const candidateName = "Vishesh"; // Personalized greeting for the user

    const mentorVideo = document.getElementById('mentorVideo');
    const mentorNamePlate = document.getElementById('mentorNamePlate');
    const mentorRolePlate = document.getElementById('mentorRolePlate');
    const connectingMentor = document.getElementById('connectingMentor');

    if (selectedMentor.toLowerCase().includes('ava')) {
      mentorNamePlate.innerText = "Ava";
      mentorRolePlate.innerText = "Career Coach Mentor";
      connectingMentor.innerText = "Ava";
      mentorVideo.src = "https://assets.mixkit.co/videos/preview/mixkit-business-woman-analyzing-data-on-laptop-40068-large.mp4";
    } else {
      mentorNamePlate.innerText = "Arjun";
      mentorRolePlate.innerText = "Senior AI Engineer Mentor";
      connectingMentor.innerText = "Arjun";
      mentorVideo.src = "https://assets.mixkit.co/videos/preview/mixkit-portrait-of-a-fashion-man-looking-at-the-camera-40283-large.mp4";
    }

    // 2. Candidate Webcam Activator
    let localStream = null;
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(stream => {
          localStream = stream;
          document.getElementById('userCam').srcObject = stream;
        })
        .catch(err => console.log("Webcam access optional or unavailable"));
    }

    // Call Timer Counter
    let durationSeconds = 0;
    setInterval(() => {
      durationSeconds++;
      const s = String(durationSeconds % 60).padStart(2, '0');
      document.getElementById('callDuration').innerText = s;
    }, 1000);

    // 3. Personalized First Call Welcome Speech
    function triggerCallGreeting() {
      // Hide connecting splash screen
      setTimeout(() => {
        document.getElementById('connectingScreen').classList.add('hidden');
        
        const welcomeMessage = `Hi ${candidateName}, I'm ${selectedMentor}. Welcome to your AI career interview! I will be taking your 5-round assessment today. Let's begin with Round 1: Tell me about your technical background and what core technologies you feel most confident in.`;

        document.getElementById('speechLabel').innerText = `${selectedMentor.toUpperCase()} IS ASKING:`;
        document.getElementById('speechText').innerText = welcomeMessage;

        speakMentor(welcomeMessage);
      }, 1400);
    }

    // Web Speech API Voice Synthesis
    function speakMentor(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.rate = 1.0;
        msg.pitch = selectedMentor.toLowerCase().includes('ava') ? 1.15 : 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    // 4. Round Navigation & Questions
    let currentRound = 1;

    function countWords() {
      const val = document.getElementById('candidateInput').value.trim();
      const count = val ? val.split(/\s+/).length : 0;
      document.getElementById('wordCounter').innerText = `${count} words`;
    }

    // Submit Answer & Step through rounds
    function sendAnswer() {
      const answer = document.getElementById('candidateInput').value.trim();
      const btn = document.getElementById('submitAnswerBtn');

      btn.innerText = "Evaluating Answer...";
      btn.style.opacity = "0.7";

      fetch('/api/interview/submit-answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answer: answer || "Response provided via video call." })
      })
      .then(res => res.json())
      .then(data => {
        btn.innerHTML = 'Submit Answer & Next <i data-lucide="arrow-right" style="width:18px; height:18px;"></i>';
        btn.style.opacity = "1";
        lucide.createIcons();

        if (data.completed) {
          // Completed all 5 rounds -> go to skill-gap
          document.getElementById('speechText').innerText = "Excellent work, Vishesh! I have gathered all diagnostic data. Analyzing your skill gaps now...";
          speakMentor("Excellent work, Vishesh! Your interview is complete. Analyzing your skill gaps now.");
          setTimeout(() => {
            window.location.href = data.redirect || '/skill-gap';
          }, 3200);
        } else {
          currentRound = data.next_round;
          updateRoundUI(currentRound);
          document.getElementById('candidateInput').value = '';
          countWords();
          fetchNextQuestion();
        }
      });
    }

    function updateRoundUI(round) {
      for (let i = 1; i <= 5; i++) {
        const dot = document.getElementById(`dot${i}`);
        if (i === round) {
          dot.className = 'round-dot active';
        } else {
          dot.className = 'round-dot';
        }
      }
    }

    function fetchNextQuestion() {
      fetch('/api/interview/question')
        .then(res => res.json())
        .then(data => {
          document.getElementById('speechLabel').innerText = `ROUND ${data.round} OF 5 • QUESTION:`;
          document.getElementById('speechText').innerText = data.question;
          speakMentor(data.question);
        });
    }

    // Call Actions (Mute/Video)
    let isMicActive = false;
    let recognition = null;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (e) => {
        let transcript = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          transcript += e.results[i][0].transcript;
        }
        document.getElementById('candidateInput').value += ' ' + transcript;
        countWords();
      };
    }

    function toggleCandidateMic() {
      const btn = document.getElementById('micToggleBtn');
      if (!isMicActive) {
        if (recognition) recognition.start();
        isMicActive = true;
        btn.classList.add('active');
      } else {
        if (recognition) recognition.stop();
        isMicActive = false;
        btn.classList.remove('active');
      }
    }

    function toggleCandidateCam() {
      const camBtn = document.getElementById('camToggleBtn');
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.enabled = !videoTrack.enabled;
          camBtn.classList.toggle('active', !videoTrack.enabled);
        }
      }
    }

    function terminateCall() {
      if (confirm("Do you want to conclude the AI interview early?")) {
        window.location.href = "/skill-gap";
      }
    }

    // Start Call on page ready
    window.addEventListener('DOMContentLoaded', triggerCallGreeting);
  </script>
</body>
</html>
