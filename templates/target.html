<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerX - Select Target Job</title>

    <style>
        body{
            background:#071633;
            color:white;
            font-family:Arial,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:#0d234f;
            padding:40px;
            border-radius:20px;
            width:500px;
            text-align:center;
        }

        h1{
            color:#4fc3ff;
            margin-bottom:20px;
        }

        select{
            width:100%;
            padding:12px;
            font-size:18px;
            margin-top:20px;
            border-radius:10px;
        }

        button{
            margin-top:25px;
            padding:12px 25px;
            border:none;
            border-radius:10px;
            background:#31b7ff;
            color:white;
            font-size:18px;
            cursor:pointer;
        }
    </style>
</head>
<body>

    <div class="card">

        <h1>Select Your Target Job</h1>

        <select>
            <option>AI Engineer</option>
            <option>ML Engineer</option>
            <option>Data Scientist</option>
            <option>Software Engineer</option>
            <option>Cyber Security Engineer</option>
            <option>Cloud Engineer</option>
        </select>

        <br>

        <button>Continue</button>

    </div>

</body>
</html>
